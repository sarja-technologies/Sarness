[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sarness-engine"
version = "0.4.0"
description = "Sarness Engine — self-hosted inference, workflow and job server for the Sarness desktop workstation"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "psutil>=5.9",
  "nvidia-ml-py>=12",
  "pillow>=10",
  "numpy>=1.26",
  "huggingface_hub>=0.25",
  "python-multipart>=0.0.9",
  "cryptography>=42",
]

[project.optional-dependencies]
# GPU inference stack (installed by scripts/install-engine.sh with the right CUDA index)
inference = [
  "torch>=2.4",
  "torchvision",
  "diffusers>=0.40",
  "transformers>=5.0",
  "accelerate>=0.34",
  "safetensors",
  "sentencepiece",
  "protobuf",
  "peft",
  "ftfy",
  "imageio>=2.34",
  "imageio-ffmpeg",
  # LTX-2 image-to-video re-compresses its start frame as H.264 (as in training) through PyAV
  "av",
  "opencv-python-headless",
  "spandrel",
]
dev = ["pytest>=8", "pytest-asyncio"]

[project.scripts]
sarness-engine = "sarness_engine.cli:main"

[tool.setuptools.packages.find]
include = ["sarness_engine*"]

[tool.setuptools.package-data]
"sarness_engine.snp" = ["ops.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "gpu: requires a CUDA GPU and downloaded models (deselect with -m 'not gpu')",
]
