name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install engine (CPU, no GPU/models required)
        working-directory: engine
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" || pip install -e . pytest
      - name: pytest
        working-directory: engine
        run: python -m pytest -q -m "not gpu"

  # The engine also runs on ARM64 servers (NVIDIA DGX Spark / GB10); same suite on an ARM64 runner.
  engine-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install engine with the CPU inference stack (no GPU/models required)
        working-directory: engine
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,inference]"
      - name: pytest
        working-directory: engine
        run: python -m pytest -q -m "not gpu"

  desktop:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: System libraries for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsecret-1-dev libssl-dev patchelf
      - name: Install dependencies
        working-directory: desktop
        run: pnpm install --frozen-lockfile
      - name: svelte-check
        working-directory: desktop
        run: npx svelte-check --tsconfig ./tsconfig.json --threshold error
      - name: vitest
        working-directory: desktop
        run: npx vitest run
      - name: Frontend build
        working-directory: desktop
        run: pnpm build
      - name: Package engine bundle (Tauri resource)
        run: scripts/package-engine.sh
      - name: cargo test
        working-directory: desktop/src-tauri
        run: cargo test --quiet

  installer-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash -n scripts/install-engine.sh
      - run: sudo apt-get install -y shellcheck && shellcheck -S error scripts/*.sh
