[package]
name = "sarness"
version = "0.1.0"
description = "Sarness (Sarja Harness) — self-hosted AI workstation"
authors = ["Sarness"]
edition = "2021"
rust-version = "1.80"

[lib]
name = "sarness_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
tauri-plugin-opener = "2.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws", "multipart"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
bytes = "1"
http = "1"
keyring = { version = "3.6", features = ["sync-secret-service", "crypto-rust"] }
dirs = "6"
rand = "0.9"
hex = "0.4"
sha2 = "0.10"
anyhow = "1"
thiserror = "2"
url = "2"
log = "0.4"
env_logger = "0.11"
uuid = { version = "1", features = ["v4"] }
percent-encoding = "2"
similar = "2"
ignore = "0.4"
regex = "1"
libc = "0.2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rustls-pki-types = "1"
rustls-native-certs = "0.8"
hmac = "0.12"
socket2 = "0.6"
base64 = "0.22"

[dev-dependencies]
tempfile = "3"
rcgen = { version = "0.13", default-features = false, features = ["crypto", "ring", "pem"] }

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
strip = true
panic = "abort"
